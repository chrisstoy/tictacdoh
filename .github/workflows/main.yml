# Simple workflow for deploying static content to GitHub Pages
# https://chrisstoy.github.io/tictacdoh/
name: Build and Deploy to Pages

on:
  # Manual only. Web publishing goes through the deploy-app skill; merging to
  # main does not deploy.
  workflow_dispatch:

# Sets the GITHUB_TOKEN permissions to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment
concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  # Build the application
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        env:
          GITHUB_PAGES: true
          # Bake production multiplayer Worker into the PWA (Online Create/Join on web).
          EXPO_PUBLIC_MULTIPLAYER_URL: https://tictacdoh-multiplayer.chrisstoy.workers.dev
        run: npm run build
        # Permission to set EXPO_PUBLIC_MULTIPLAYER_URL here was granted for #53 (web multiplayer).

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

  # Deploy to GitHub Pages
  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
